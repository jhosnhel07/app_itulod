name: app_itulod
description: "Ilocos Transport Utility and Logistics Operation for Delivery Mobile Application"
publish_to: 'none'

version: 1.0.48+49

environment:
  # flutter_map 8 requires Dart >= 3.6.0
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter

  # Cupertino Icons
  cupertino_icons: ^1.0.8

  # Supabase
  supabase_flutter: ^2.8.3

  # State Management & Routing
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1

  # Environment & Storage
  flutter_dotenv: ^5.2.1
  shared_preferences: ^2.3.5

  # UI & Media
  cached_network_image: ^3.4.1
  image_picker: ^1.1.2
  flutter_svg: ^2.0.17
  shimmer: ^3.0.0
  fl_chart: ^0.70.2
  badges: ^3.1.2
  google_fonts: ^6.2.1
  font_awesome_flutter: ^11.0.0

  # Maps & Location (OpenStreetMap — no API key required)
  flutter_map: ^8.3.1
  latlong2: ^0.10.1
  geolocator: ^14.0.3

  # Utilities & Networking
  intl: ^0.20.2
  timeago: ^3.7.0
  connectivity_plus: ^6.1.3
  url_launcher: ^6.3.1
  webview_flutter: ^4.10.0
  permission_handler: ^11.3.1
  http: ^1.6.0
  flutter_local_notifications: ^22.3.2
  firebase_core: ^5.0.0
  firebase_messaging: ^17.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

  # Generates the native launch screen so the ~1s of engine + Supabase startup
  # shows the branded splash instead of a blank/black window.
  flutter_native_splash: ^2.4.3
  # Used only by tool/make_splash_icon.dart (one-off asset prep).
  image: ^4.9.2
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/images/logo.png
    - assets/images/splash_icon.png
    - assets/images/splash_native.png

# Native launch screen — matches lib/features/splash/splash_view.dart.
# Regenerate after edits:  dart run flutter_native_splash:create
flutter_native_splash:
  color: "#F8FAFC"
  image: assets/images/splash_native.png
  android_12:
    color: "#F8FAFC"
    image: assets/images/splash_native.png
  android: true
  ios: true
  web: false


# Home-screen icon — run `dart run tool/make_launcher_icon.dart` then
# `dart run flutter_launcher_icons` after changing the logo.
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/launcher_icon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/launcher_foreground.png"
  # launcher_foreground.png already keeps the emblem inside the safe zone.
  adaptive_icon_foreground_inset: 0
  min_sdk_android: 21
