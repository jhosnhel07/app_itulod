name: app_itulod
description: "Intelligent Transport and Unified Logistics On-Demand Delivery Mobile Application"
publish_to: 'none'

version: 1.0.0+1

environment:
  # flutter_map 8 requires Dart >= 3.6.0
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter

  # Cupertino Icons
  cupertino_icons: ^1.0.8

  # Supabase
  supabase_flutter: ^2.8.3

  # State Management & Routing
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1

  # Environment & Storage
  flutter_dotenv: ^5.2.1
  shared_preferences: ^2.3.5

  # UI & Media
  cached_network_image: ^3.4.1
  image_picker: ^1.1.2
  flutter_svg: ^2.0.17
  shimmer: ^3.0.0
  fl_chart: ^0.70.2
  badges: ^3.1.2
  google_fonts: ^6.2.1
  font_awesome_flutter: ^11.0.0

  # Maps & Location (OpenStreetMap — no API key required)
  flutter_map: ^8.3.1
  latlong2: ^0.10.1
  geolocator: ^14.0.3

  # Utilities & Networking
  intl: ^0.20.2
  timeago: ^3.7.0
  connectivity_plus: ^6.1.3
  url_launcher: ^6.3.1
  webview_flutter: ^4.10.0
  permission_handler: ^11.3.1
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/images/logo.png

